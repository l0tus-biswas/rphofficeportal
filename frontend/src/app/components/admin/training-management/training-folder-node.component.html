<ng-container *ngIf="depth === 0; else nestedRow">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="d-flex align-items-center">
        <div cdkDragHandle class="drag-handle me-3">
          <i class="bi bi-grip-vertical fs-4 text-muted"></i>
        </div>
        <div class="flex-grow-1">
          <h5 class="mb-1">
            <img *ngIf="folder.thumbnail" [src]="getThumbnailUrl(folder.thumbnail)"
                 class="rounded me-2" style="width: 36px; height: 36px; object-fit: cover; vertical-align: middle;">
            <i *ngIf="!folder.thumbnail" class="bi bi-folder-fill text-warning me-2"></i>{{ folder.name }}
          </h5>
          <small *ngIf="folder.description" class="text-muted">{{ folder.description }}</small>
        </div>
        <div class="d-flex gap-2 ms-2">
          <button class="btn btn-sm btn-outline-primary" (click)="addSubfolder.emit(folder._id)" title="Add subfolder">
            <i class="bi bi-folder-plus"></i>
          </button>
          <button class="btn btn-sm btn-outline-secondary" (click)="editFolder.emit(folder)">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="removeFolder.emit(folder)">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>

      <ng-container *ngTemplateOutlet="children"></ng-container>
    </div>
  </div>
</ng-container>

<ng-template #nestedRow>
  <div class="d-flex align-items-center py-2 border-bottom">
    <div cdkDragHandle class="drag-handle me-2">
      <i class="bi bi-grip-vertical text-muted"></i>
    </div>
    <div class="flex-grow-1">
      <i class="bi bi-folder text-info me-2"></i>
      <span>{{ folder.name }}</span>
      <small *ngIf="folder.description" class="text-muted ms-2">— {{ folder.description }}</small>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-primary" (click)="addSubfolder.emit(folder._id)" title="Add sub-subfolder">
        <i class="bi bi-folder-plus"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary" (click)="editFolder.emit(folder)">
        <i class="bi bi-pencil"></i>
      </button>
      <button class="btn btn-sm btn-outline-danger" (click)="removeFolder.emit(folder)">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>

  <ng-container *ngTemplateOutlet="children"></ng-container>
</ng-template>

<ng-template #children>
  <div *ngIf="subfolders.length > 0" class="mt-2 ms-4">
    <div cdkDropList (cdkDropListDropped)="dropSubfolder($event)" class="drag-list">
      <app-training-folder-node
        *ngFor="let sub of subfolders"
        cdkDrag
        [folder]="sub"
        [folders]="folders"
        [depth]="depth + 1"
        (addSubfolder)="addSubfolder.emit($event)"
        (editFolder)="editFolder.emit($event)"
        (removeFolder)="removeFolder.emit($event)">
      </app-training-folder-node>
    </div>
  </div>
</ng-template>
