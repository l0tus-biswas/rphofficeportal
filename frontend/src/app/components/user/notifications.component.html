<app-navbar></app-navbar>

<div class="container mt-4 mb-5">
  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h4 class="mb-0">
            <i class="bi bi-bell-fill me-2"></i>Notifications
            <span *ngIf="unreadCount > 0" class="badge bg-danger ms-2">{{ unreadCount }}</span>
          </h4>
          <div class="btn-group">
            <button class="btn btn-sm btn-light" (click)="toggleUnreadFilter()" [class.active]="showUnreadOnly">
              <i class="bi bi-filter me-1"></i>{{ showUnreadOnly ? 'Show All' : 'Unread Only' }}
            </button>
            <button class="btn btn-sm btn-light" (click)="markAllAsRead()" *ngIf="unreadCount > 0">
              <i class="bi bi-check-all me-1"></i>Mark All Read
            </button>
            <button class="btn btn-sm btn-light" (click)="deleteAllRead()">
              <i class="bi bi-trash me-1"></i>Clear Read
            </button>
          </div>
        </div>
        
        <div class="card-body p-0">
          <div *ngIf="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div *ngIf="!loading && notifications.length === 0" class="text-center py-5">
            <i class="bi bi-bell-slash fs-1 text-muted"></i>
            <p class="mt-3 text-muted">No notifications{{ showUnreadOnly ? ' unread' : '' }}</p>
          </div>

          <div class="notification-list" *ngIf="!loading && notifications.length > 0">
            <div *ngFor="let notification of notifications" 
                 class="notification-item" 
                 [class.unread]="!notification.isRead"
                 (click)="markAsRead(notification)">
              <div class="notification-icon" [class]="'text-' + getNotificationColor(notification.type)">
                <i [class]="'bi ' + getNotificationIcon(notification.type)"></i>
              </div>
              <div class="notification-content flex-grow-1">
                <h6 class="mb-1">{{ notification.title }}</h6>
                <p class="mb-1">{{ notification.message }}</p>
                <small class="text-muted">
                  <i class="bi bi-clock me-1"></i>{{ getTimeAgo(notification.createdAt) }}
                </small>
              </div>
              <div class="notification-actions">
                <button class="btn btn-sm btn-outline-danger" 
                        (click)="deleteNotification(notification, $event)"
                        title="Delete">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="card-footer" *ngIf="totalPages > 1">
          <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-sm btn-outline-primary" 
                    (click)="prevPage()" 
                    [disabled]="page === 1">
              <i class="bi bi-chevron-left"></i> Previous
            </button>
            <span>Page {{ page }} of {{ totalPages }}</span>
            <button class="btn btn-sm btn-outline-primary" 
                    (click)="nextPage()" 
                    [disabled]="page === totalPages">
              Next <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
