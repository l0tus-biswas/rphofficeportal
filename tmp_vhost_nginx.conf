# NOTE: This site runs the Node backend under Plesk's Phusion Passenger
# (see "X-Powered-By: Phusion Passenger" on responses). Passenger serves the
# app for ALL non-static paths, including /api, /health and /socket.io/.
# Do NOT add a `location /socket.io/ { proxy_pass http://127.0.0.1:5000 }`
# block — nothing listens on a TCP port under Passenger, so it returns 502.
# Let /socket.io/ fall through to Passenger (same as /api).

location /logs {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    auth_basic "Log Viewer";
    auth_basic_user_file /var/www/vhosts/system/rhpoffice.com/conf/.htpasswd_logs;
}

location /uptime/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
