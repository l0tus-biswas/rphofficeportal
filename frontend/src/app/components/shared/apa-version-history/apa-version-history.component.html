<div class="card mb-4" data-testid="apa-version-history">
  <div class="card-header">
    <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>Version History</h5>
  </div>
  <div class="card-body">
    <div *ngIf="loading" class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary"></div></div>
    <div *ngIf="!loading && error" class="text-danger small">{{ error }}</div>

    <ul class="list-group list-group-flush" *ngIf="!loading && !error">
      <li class="list-group-item px-0" *ngFor="let v of versions">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
          <div>
            <strong>Version {{ v.version }}</strong>
            <span class="badge bg-success ms-2" *ngIf="v.isCurrent">Current</span>
            <span class="badge bg-warning text-dark ms-2" *ngIf="v.isCurrent && v.awaitingSignature">Awaiting signature</span>
            <div class="text-muted small">{{ reasonLabel(v.reason) }}</div>
            <div class="text-muted small" *ngIf="v.signedAt">Signed {{ v.signedAt | date:'medium' }}</div>
            <div class="text-muted small" *ngIf="v.supersededAt">Replaced {{ v.supersededAt | date:'medium' }}</div>
            <div class="text-danger small" *ngIf="v.rejectionReason">Rejected: {{ v.rejectionReason }}</div>
          </div>
          <div class="d-flex gap-2">
            <a *ngIf="v.signedDocumentUrl" class="btn btn-sm btn-outline-primary" [href]="v.signedDocumentUrl" target="_blank" rel="noopener">
              <i class="bi bi-file-earmark-pdf me-1"></i>Signed PDF
            </a>
            <button *ngIf="!v.isCurrent" class="btn btn-sm btn-outline-secondary" (click)="toggle(v.version)">
              {{ expanded[v.version] ? 'Hide' : 'View' }} details
            </button>
          </div>
        </div>

        <table class="table table-sm mt-2 mb-0" *ngIf="!v.isCurrent && expanded[v.version]">
          <tbody>
            <tr *ngFor="let r of rows(v.snapshot)">
              <th class="w-50 fw-normal text-muted">{{ r.label }}</th>
              <td>{{ r.value }}</td>
            </tr>
          </tbody>
        </table>
      </li>
    </ul>
  </div>
</div>
