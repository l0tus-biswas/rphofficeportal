name: CI/CD – Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run unit tests
        run: cd backend && npx jest --selectProjects unit --coverage --forceExit --detectOpenHandles
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-minimum-16-chars-long
          MONGODB_URI: mongodb://localhost:27017/rhpoffice_test
          APP_URL: http://localhost:4200
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_test_fake
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SMTP_HOST: localhost
          SMTP_PORT: '587'
          SMTP_USER: test@test.com
          SMTP_PASSWORD: testpass
          SMTP_FROM_NAME: Test App
          SMTP_FROM_EMAIL: test@test.com

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npx ng build --configuration=production

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.APP_DIR }}
            git pull origin main
            npm install --production
            cd backend && npm install && cd ..
            cd frontend && npm install && npx ng build --configuration=production && cd ..
            # Ensure Puppeteer's Chrome is installed in the SAME cache the running
            # app uses, so card rendering works (otherwise "Could not find Chrome").
            export PUPPETEER_CACHE_DIR="$HOME/.cache/puppeteer"
            cd backend && npx puppeteer browsers install chrome && cd ..
            pm2 restart rhp-office-portal --update-env || pm2 start ecosystem.config.json
            pm2 save
            echo "Deploy complete: $(date)"
