<div class="reset-password-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
              <h2 class="mt-3 mb-2">Reset Your Password</h2>
              <p class="text-muted">Enter your new password below</p>
            </div>

            <div *ngIf="success" class="alert alert-success">
              <i class="bi bi-check-circle me-2"></i>
              Password reset successful! Redirecting to login...
            </div>

            <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ error }}
              <button type="button" class="btn-close" (click)="error = ''"></button>
            </div>

            <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!success && token">
              <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                  </span>
                  <input
                    [type]="showPassword ? 'text' : 'password'"
                    class="form-control"
                    id="password"
                    formControlName="password"
                    placeholder="Enter new password"
                    [class.is-invalid]="isFieldInvalid('password')">
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    (click)="togglePasswordVisibility('password')">
                    <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                  </button>
                </div>
                <div *ngIf="isFieldInvalid('password')" class="invalid-feedback d-block">
                  <small *ngIf="resetForm.get('password')?.hasError('required')">Password is required</small>
                  <small *ngIf="resetForm.get('password')?.hasError('minlength')">Password must be at least 6 characters</small>
                </div>
              </div>

              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                  </span>
                  <input
                    [type]="showConfirmPassword ? 'text' : 'password'"
                    class="form-control"
                    id="confirmPassword"
                    formControlName="confirmPassword"
                    placeholder="Confirm new password"
                    [class.is-invalid]="isFieldInvalid('confirmPassword') || hasPasswordMismatch()">
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    (click)="togglePasswordVisibility('confirmPassword')">
                    <i [class]="showConfirmPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                  </button>
                </div>
                <div *ngIf="isFieldInvalid('confirmPassword')" class="invalid-feedback d-block">
                  <small>Please confirm your password</small>
                </div>
                <div *ngIf="hasPasswordMismatch()" class="invalid-feedback d-block">
                  <small>Passwords do not match</small>
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 mb-3"
                [disabled]="loading || resetForm.invalid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                <i *ngIf="!loading" class="bi bi-check-circle me-2"></i>
                {{ loading ? 'Resetting...' : 'Reset Password' }}
              </button>
            </form>

            <div class="text-center">
              <a routerLink="/login" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Login
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
