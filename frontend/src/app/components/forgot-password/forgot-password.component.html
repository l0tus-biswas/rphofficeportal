<div class="forgot-password-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card shadow border-0">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="bi bi-key" style="font-size: 3rem; color: #0d6efd;"></i>
              <h2 class="mt-3 mb-2">Forgot Password?</h2>
              <p class="text-muted">Enter your email to reset your password</p>
            </div>

            <!-- Success Message -->
            <div *ngIf="success" class="alert alert-success">
              <i class="bi bi-check-circle-fill me-2"></i>
              {{ successMessage }}
              <div class="mt-3">
                <a routerLink="/login" class="btn btn-success btn-sm">
                  <i class="bi bi-arrow-left me-1"></i>Back to Login
                </a>
              </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="error" class="alert alert-danger alert-dismissible fade show">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
              <button type="button" class="btn-close" (click)="error = ''" aria-label="Close"></button>
            </div>

            <!-- Form -->
            <form *ngIf="!success" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
              <div class="mb-4">
                <label for="email" class="form-label">Email Address</label>
                <input 
                  type="email" 
                  class="form-control form-control-lg" 
                  id="email" 
                  formControlName="email"
                  [class.is-invalid]="isFieldInvalid('email')"
                  placeholder="Enter your email">
                <div class="invalid-feedback">
                  Please enter a valid email address
                </div>
              </div>

              <div class="d-grid gap-2">
                <button 
                  type="submit" 
                  class="btn btn-primary btn-lg" 
                  [disabled]="loading">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                  {{ loading ? 'Sending...' : 'Send Reset Link' }}
                </button>
              </div>

              <div class="text-center mt-4">
                <a routerLink="/login" class="text-decoration-none">
                  <i class="bi bi-arrow-left me-1"></i>Back to Login
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
