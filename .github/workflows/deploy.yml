name: CI/CD – Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run unit tests
        run: cd backend && npx jest --selectProjects unit --coverage --forceExit --detectOpenHandles
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-minimum-16-chars-long
          MONGODB_URI: mongodb://localhost:27017/rhpoffice_test
          APP_URL: http://localhost:4200
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_test_fake
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SMTP_HOST: localhost
          SMTP_PORT: '587'
          SMTP_USER: test@test.com
          SMTP_PASSWORD: testpass
          SMTP_FROM_NAME: Test App
          SMTP_FROM_EMAIL: test@test.com

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npx ng build --configuration=production

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Fail the job loudly on any error instead of silently falling
            # through to a `pm2 restart` of the still-stale code (this bit us:
            # a stuck git pull left production on old code for hours while
            # this job kept reporting green).
            set -e
            cd ${{ secrets.APP_DIR }}
            git fetch origin main
            git reset --hard origin/main
            DEPLOYED_SHA=$(git rev-parse HEAD)
            if [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
              echo "FATAL: checked-out commit ($DEPLOYED_SHA) does not match pushed commit (${{ github.sha }})"
              exit 1
            fi
            npm install --production
            cd backend && npm install && cd ..
            cd frontend && npm install && npx ng build --configuration=production && cd ..
            # Ensure Puppeteer's Chrome is installed in the SAME cache the running
            # app uses, so card rendering works (otherwise "Could not find Chrome").
            export PUPPETEER_CACHE_DIR="$HOME/.cache/puppeteer"
            cd backend && npx puppeteer browsers install chrome && cd ..
            pm2 restart rhp-office-portal --update-env || pm2 start ecosystem.config.json
            pm2 save
            # Verify the running process actually restarted just now (uptime in
            # ms should be small), not that it merely still exists from before.
            sleep 2
            pm2 jlist | node -e "
              const procs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const p = procs.find(p => p.name === 'rhp-office-portal');
              if (!p) { console.error('FATAL: rhp-office-portal not found in pm2 process list'); process.exit(1); }
              const uptimeMs = Date.now() - p.pm2_env.pm_uptime;
              console.log('rhp-office-portal uptime:', uptimeMs, 'ms, status:', p.pm2_env.status);
              if (uptimeMs > 60000) { console.error('FATAL: process uptime too high — restart did not take effect'); process.exit(1); }
              if (p.pm2_env.status !== 'online') { console.error('FATAL: process status is not online'); process.exit(1); }
            "
            echo "Deploy complete: $(date) — commit $DEPLOYED_SHA live"
